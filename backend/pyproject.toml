[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyforge-backend"
version = "0.1.0"
description = "PyForge backend service"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "aiosqlite",
    "redis",
    "httpx",
    "aiohttp",
    "pydantic",
    "email-validator",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "bcrypt==4.0.1",
    "python-multipart",
    "APScheduler",
]

[project.optional-dependencies]
auth = [
    "authjs[bcrypt]",
]
