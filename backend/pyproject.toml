[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyforge-backend"
version = "0.1.0"
description = "PyForge backend service"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "C", "N", "N8", "ARG", "B", "S", "T", "UP"]
exclude = "*.py"
target-version = "py311"

[tool.mypy]
python-version = "3.11"
disallow_untyped_defs = True
disallow_unbound_type_vars = True
strict = True

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["backend/tests/conftest.py"]
cov = "app"
cov_fail_under = 80

[tool.bandit]
exclude = ["backend/scripts/*", "backend/tests/*"]