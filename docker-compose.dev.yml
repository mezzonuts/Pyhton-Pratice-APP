version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pyforge-backend-dev
    restart: unless-stopped
    environment:
      - APP_ENV=development
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - DATABASE_URL=postgresql://postgres:test@postgres:5432/pyforge
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pyforge-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pyforge-frontend-dev
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://host.docker.internal:8000
      - NX_PORT=3000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src:rw
      - ./frontend/package.json:/app/package.json:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/tailwind.config.js:/app/tailwind.config.js:ro
      - ./frontend/.prettierrc:/app/.prettierrc:ro
      - ./frontend/postcss:/app/postcss:ro
      - ./frontend/src/app:/app/src/app:rw
      - ./frontend/src/components:/app/src/components:rw
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pyforge-net

  postgres:
    image: postgres:15-alpine
    container_name: pyforge-postgres-dev
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=pyforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pyforge-net

  redis:
    image: redis:7-alpine
    container_name: pyforge-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pyforge-net

volumes:
  postgres_data:
  redis_data:

networks:
  pyforge-net:
    driver: bridge